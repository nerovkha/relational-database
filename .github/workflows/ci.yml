name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bloglist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Write environment file
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/bloglist_test" > .env
          echo "SECRET=citestsecret" >> .env
      - name: Run migrations
        run: npm run migrate
      - name: Seed the database
        run: npm run seed
      - name: Query the blogs table
        run: npm run cli:blogs
